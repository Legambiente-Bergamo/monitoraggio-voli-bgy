name: Monitoraggio BGY - Diagnostica Integrata

on:
  schedule:
    - cron: '*/5 21-23 * * *'  # Radar e meteo ogni 5 minuti la notte
    - cron: '*/5 0-3 * * *'
    - cron: '0 21 * * *'       # SACBO alle 23:00 italiane (21:00 UTC)
    - cron: '0 4 * * *'        # Chiusura e mail alle 06:00 italiane (04:00 UTC)
  workflow_dispatch:          # Avvio manuale per i test

jobs:
  bgy_process:
    runs-on: ubuntu-latest
    # FORZATURA FUSO ORARIO ITALIANO GLOBALE
    env:
      TZ: "Europe/Rome"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Accedi al codice
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa Librerie
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Esecuzione Logica e Diagnostica
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        HOURA_IT=$(date +'%H:%M')
        DATE_STR=$(date +'%Y%m%d')
        
        mkdir -p dati report
        
        echo "[BASH][${HOURA_IT}] --- AVVIO SESSIONE DI MONITORAGGIO ---" >> report/diario_operazioni.log

        # Esegui SACBO se sono le 23:00 o se è un lancio manuale di test
        if [ "$HOURA_IT" = "23:00" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          python bgy_sacbo_capture.py $DATE_STR
        fi

        # Esecuzione moduli standard
        python bgy_meteo.py $DATE_STR
        python bgy_radar.py $DATE_STR

        # Spedisci la mail alla fine del report o se è un test manuale
        if [ "$HOURA_IT" = "06:00" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          python bgy_summary.py $DATE_STR
        fi

    - name: Archivia File su GitHub
      uses: actions/upload-artifact@v4
      with:
        name: dati-bgy-diagnostica
        path: |
          dati/
          report/
        retention-days: 7
