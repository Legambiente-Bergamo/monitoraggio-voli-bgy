name: Monitoraggio Continuo BGY e Invio Report

on:
  schedule:
    # 1. Ogni 5 minuti dalle 23:00 alle 23:55 italiane (21:00 - 21:55 UTC)
    - cron: '*/5 21 * * *'
    
    # 2. Ogni 5 minuti da mezzanotte alle 05:55 italiane (22:00 UTC - 03:55 UTC)
    - cron: '*/5 22-23,0-3 * * *'
    
    # 3. Alle 06:00 esatte italiane (04:00 UTC) per la chiusura, analisi e invio mail
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Accedi al codice del Repository
      uses: actions/checkout@v4

    - name: Configura Python ambiente cloud
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa Firefox Ufficiale di GitHub
      uses: browser-actions/setup-firefox@v1
      with:
        firefox-version: 'latest'

    - name: Installa Dipendenze di Sistema (Xvfb)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb

    - name: Installa Librerie Python
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 selenium schedule

    - name: Determina Azione (Cattura vs Report Finale)
      id: check-hour
      run: |
        HOURA_IT=$(TZ="Europe/Rome" date +'%H')
        echo "Ora locale rilevata: $HOURA_IT"
        if [ "$HOURA_IT" = "06" ]; then
          echo "action_type=report" >> $GITHUB_OUTPUT
        else
          echo "action_type=capture" >> $GITHUB_OUTPUT
        fi

    - name: FASE CATTURA Accumulo dati notturni
      if: steps.check-hour.outputs.action_type == 'capture'
      run: |
        DATE_STR=$(TZ="Europe/Rome" date +'%Y%m%d')
        echo "Esecuzione campionamento rapido per data: $DATE_STR"
        python bgy_meteo.py $DATE_STR
        python bgy_radar.py $DATE_STR
        xvfb-run --server-args="-screen 0 1920x1080x24" python bgy_sacbo_capture.py $DATE_STR

    - name: FASE REPORT Generazione Analisi e Calcolo Decibel
      if: steps.check-hour.outputs.action_type == 'report'
      run: |
        DATE_STR=$(TZ="Europe/Rome" date +'%Y%m%d')
        echo "Generazione reportistica finale per la notte del: $DATE_STR"
        if [ -f "bgy_report.py" ]; then python bgy_report.py $DATE_STR; fi
        if [ -f "bgy_report_vettori.py" ]; then python bgy_report_vettori.py $DATE_STR; fi
        python bgy_centralina_rumore.py $DATE_STR

    - name: Invia Report e Registro Sforamenti via Mail (Gmail)
      if: steps.check-hour.outputs.action_type == 'report'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: 📊 Report Monitoraggio Voli Notturni BGY - Oggi
        to: info@legambientebergamo.it
        from: Monitor Bot Legambiente <legambiente.bg@gmail.com>
        body: |
          Buongiorno Circolo,
          
          In allegato trovate i report generati automaticamente relativi al monitoraggio ambientale dell'Aeroporto di Bergamo Orio al Serio svolto questa notte.
          
          Il file di stima acustica evidenzia gli sforamenti teorici calcolati sopra i 60 dB in prossimità delle centraline ARPA, pesati in base ai modelli di aeromobile intercettati.
          
          Un caro saluto,
          Il Bot di Monitoraggio Ambientale
        attachments: |
          report/rumore_centraline_*.csv
          report/report_completo_*.csv

    - name: Salva i dati estratti come Allegato del Workflow
      uses: actions/upload-artifact@v4
      with:
        name: dati-monitoraggio-bgy
        path: |
          dati/
          report/
          screenshots/
        retention-days: 7
