name: Monitoraggio Notturno BGY

on:
  schedule:
    # 17:00 UTC = 19:00 Italiane
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Accedi al codice del Repository
      uses: actions/checkout@v4

    - name: Configura Python ambiente cloud
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa pacchetti di sistema e Browser
      run: |
        sudo apt-get update
        sudo apt-get install -y firefox xvfb

    - name: Installa Librerie Python
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 selenium schedule

    - name: Esegui il Monitoraggio con Display Virtuale
      run: |
        # Avvia un server grafico virtuale in background per Selenium
        xvfb-run --server-args="-screen 0 1920x1080x24" python bgy_master.py

    - name: Salva i Report e gli Screenshot generati nel Repository
      run: |
        git config --global user.name "BGY Monitor Bot"
        git config --global user.email "bot@legambientebergamo.it"
        git add dati/ report/ screenshots/
        # Sottopone a commit solo se ci sono nuovi file per evitare errori
        git diff-index --quiet HEAD || git commit -m "Aggiornamento report automatico del $(date +'%Y-%m-%d')"
        git push
