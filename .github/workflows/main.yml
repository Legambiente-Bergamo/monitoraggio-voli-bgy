name: Monitoraggio Continuo BGY e Invio Report

on:
  schedule:
    - cron: '*/15 21-23 * * *'  # Dalle 23:00 alle 01:45 italiane
    - cron: '*/15 0-3 * * *'    # Dalle 02:00 alle 05:45 italiane
    - cron: '0 4 * * *'         # Alle 06:00 esatte italiane per la chiusura definitiva
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Accedi al codice del Repository
      uses: actions/checkout@v4

    - name: Configura Python ambiente cloud
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa Librerie Python
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Determina Azione (Logica Flessibile Oraria)
      id: check-hour
      run: |
        HOURA_IT=$(TZ="Europe/Rome" date +'%H')
        echo "Ora locale rilevata sul server: $HOURA_IT"
        if [ "$HOURA_IT" = "06" ] || [ "$HOURA_IT" = "07" ] || [ "$HOURA_IT" = "08" ] || [ "$HOURA_IT" = "09" ]; then
          echo "action_type=report" >> $GITHUB_OUTPUT
        else
          echo "action_type=capture" >> $GITHUB_OUTPUT
        fi

    - name: FASE CATTURA (Esecuzione campionamento)
      run: |
        DATE_STR=$(TZ="Europe/Rome" date +'%Y%m%d')
        python bgy_meteo.py $DATE_STR
        python bgy_radar.py $DATE_STR
        python bgy_sacbo_capture.py $DATE_STR

    - name: FASE REPORT (Elaborazione analisi e decibel)
      if: steps.check-hour.outputs.action_type == 'report'
      run: |
        DATE_STR=$(TZ="Europe/Rome" date +'%Y%m%d')
        python bgy_report.py $DATE_STR
        python bgy_centralina_rumore.py $DATE_STR
        
        # Garanzia di file esistenti per non far fallire l'azione di invio mail
        if [ ! -f "report/rumore_centraline_${DATE_STR}.csv" ]; then
          echo "timestamp,callsign,modello,descrizione_aereo,centralina,distanza_km,altitudine_m,rumore_stimato_db,valutazione" > report/rumore_centraline_${DATE_STR}.csv
          echo "06:00:00,ASSENTE,DEFAULT,Nessun volo critico rilevato,Centraline ARPA,0,0,0,REGOLARE" >> report/rumore_centraline_${DATE_STR}.csv
        fi
        if [ ! -f "report/report_completo_${DATE_STR}.csv" ]; then
          echo "timestamp,volo,tipo_operazione,rotta_provenienza,stato_volo,altitudine_metri,velocita_kmh,icao24" > report/report_completo_${DATE_STR}.csv
          echo "06:00:00,BGY_BOT,REGOLARE,ATTIVITA_NOTTURNA,COMPLETATO,0,0,UNK" >> report/report_completo_${DATE_STR}.csv
        fi

    - name: Invia Report via Mail (Gmail)
      if: steps.check-hour.outputs.action_type == 'report'
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USER }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: 📊 Report Monitoraggio Voli Notturni BGY - Oggi
        to: info@legambientebergamo.it
        from: Monitor Bot Legambiente <legambiente.bg@gmail.com>
        body: |
          Buongiorno Circolo,
          
          In allegato trovate i report generati automaticamente relativi al monitoraggio ambientale e all'analisi incrociata dei voli dell'Aeroporto di Bergamo Orio al Serio per la notte appena trascorsa.
          
          I file includono:
          1. L'analisi completa dei vettori intercettati dal radar combinati con il tabellone SACBO.
          2. La stima degli sforamenti acustici teorici calcolati sopra i 60 dB in prossimità delle centraline ARPA.
          
          Un caro saluto,
          Il Bot di Monitoraggio Ambientale
        attachments: |
          report/report_completo_*.csv
          report/rumore_centraline_*.csv

    - name: Salva i dati estratti come Allegato del Workflow
      uses: actions/upload-artifact@v4
      with:
        name: dati-monitoraggio-bgy
        path: |
          dati/
          report/
        retention-days: 7
