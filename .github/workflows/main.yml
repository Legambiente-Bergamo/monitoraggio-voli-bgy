name: Monitoraggio Notturno BGY

on:
  schedule:
    # Si attiva automaticamente ogni sera alle 23:00 Italiane (21:00 UTC)
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Accedi al codice del Repository
      uses: actions/checkout@v4

    - name: Configura Python ambiente cloud
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa Browser e Dipendenze di Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y firefox xvfb

    - name: Installa Librerie Python
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 selenium schedule

    - name: Esegui il Ciclo di Cattura ed Elaborazione Report
      run: |
        # Avvia lo scraper grafico usando il display virtuale e passa la data odierna
        xvfb-run --server-args="-screen 0 1920x1080x24" python bgy_master.py

    - name: Salva i Report e gli Screenshot nel Repository
      run: |
        git config --global user.name "BGY Monitor Bot"
        git config --global user.email "bot@legambientebergamo.it"
        git add dati/ report/ screenshots/
        git diff-index --quiet HEAD || git commit -m "Aggiornamento report automatico del $(date +'%Y-%m-%d')"
        git push
