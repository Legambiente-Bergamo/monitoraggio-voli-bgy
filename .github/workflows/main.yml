name: Monitoraggio Continuo BGY e Invio Report

on:
  schedule:
    - cron: '*/15 21-23 * * *'
    - cron: '*/15 0-3 * * *'
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Accedi al codice del Repository
      uses: actions/checkout@v4

    - name: Configura Python ambiente cloud
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installa Librerie Python
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Determina Azione (Logica Flessibile Oraria)
      id: check-hour
      run: |
        HOURA_IT=$(TZ="Europe/Rome" date +'%H')
        echo "Ora locale rilevata sul server: $HOURA_IT"
        if [ "$HOURA_IT" = "06" ] || [ "$HOURA_IT" = "07" ] || [ "$HOURA_IT" = "08" ] || [ "$HOURA_IT" = "09" ]; then
          echo "action_type=report" >> $GITHUB_OUTPUT
        else
          echo "action_type=capture" >> $GITHUB_OUTPUT
        fi

    - name: FASE CATTURA (Esecuzione campionamento)
      run: |
        DATE_STR=$(TZ="Europe/Rome" date +'%Y%m%d')
        python bgy_meteo.py $DATE_STR
        python bgy_radar.py $DATE_STR
        python bgy_sacbo_capture.py $DATE_STR

    - name: FASE REPORT & INVIO MAIL
      if: steps.check-hour.outputs.action_type == 'report'
      env:
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
      run: |
        DATE_STR=$(TZ="Europe/Rome" date +'%Y%m%d')
        python bgy_report.py $DATE_STR
        python bgy_centralina_rumore.py $DATE_STR
        python bgy_summary.py $DATE_STR

    - name: Salva i dati estratti come Allegato del Workflow
      uses: actions/upload-artifact@v4
      with:
        name: dati-monitoraggio-bgy
        path: |
          dati/
          report/
        retention-days: 7
